einstieg:
  dachzeile: 'Kira Räber · Psychologin MSc'
  titel: Psychologische Beratung für Eltern
  text: Für Mütter, Väter und Bezugspersonen, die eine Situation mit ihrem Kind oder in der Familie besser verstehen und verändern möchten. Online per Video.
  knopf: Erstgespräch buchen
  hinweis: '60 Min Erstgespräch · Tarif nach Einkommen'
  bild: ''
  bild_alt: ''
themen:
  titel: Anliegen
  text: Eltern melden sich mit sehr unterschiedlichen Fragen. Häufig geht es um eines dieser Themen.
  liste:
  - titel: Erziehung und Alltag
    text: Grenzen setzen, Wutanfälle, Schlafen, Essen, Medien, Geschwisterstreit.
  - titel: Übergänge
    text: Geburt, Kita- oder Schuleintritt, Pubertät, Umzug, Trennung.
  - titel: Eltern als Team
    text: Unterschiedliche Vorstellungen, Rollenverteilung, Patchwork, getrennt erziehen.
  - titel: Eigene Belastung
    text: Erschöpfung, Gereiztheit, Schuldgefühle, das Gefühl, nicht zu genügen.
haltung:
  titel: Arbeitsweise
  text: '[Zwei bis drei Sätze zu Ihrem fachlichen Ansatz, z. B. systemisch oder verhaltenstherapeutisch, und was das für die Beratung bedeutet.]'
  punkte:
  - titel: Zuerst verstehen
    text: Wir klären, was genau schwierig ist, seit wann, und was Sie bereits versucht haben.
  - titel: Konkret werden
    text: Sie nehmen aus jedem Gespräch etwas mit, das Sie im Alltag ausprobieren können.
  - titel: So viel wie nötig
    text: Manchmal reicht ein Gespräch. Wie es weitergeht, entscheiden Sie nach jedem Termin neu.
angebot:
  titel: Angebot
  text: Die Beratung richtet sich an Eltern und Bezugspersonen von Kindern und Jugendlichen. Sie ist keine Psychotherapie und setzt keine Diagnose voraus.
  liste:
  - status: Jetzt buchbar
    titel: Elternberatung online
    text: Gespräche per Video, allein oder als Elternpaar.
    details: '60 Min · Tarif nach Einkommen'
    hervorgehoben: true
    buchbar: true
    sichtbar: true
  - status: In Planung
    titel: Beratung vor Ort
    text: Persönliche Gespräche in Zürich. Der Standort wird hier bekannt gegeben.
    details: ''
    hervorgehoben: false
    buchbar: false
    sichtbar: true
  - status: In Planung
    titel: Psychotherapie
    text: '[Kurzbeschreibung: für wen, in welchem Setting, Abrechnung.]'
    details: ''
    hervorgehoben: false
    buchbar: false
    sichtbar: false
ablauf:
  titel: Ablauf
  schritte:
  - titel: Termin buchen
    text: Sie wählen online eine freie Zeit und erhalten die Bestätigung mit dem Videolink per E-Mail.
  - titel: Erstgespräch
    text: Sie schildern Ihr Anliegen. Am Ende wissen Sie, ob und wie eine Beratung sinnvoll ist.
  - titel: Weitere Gespräche
    text: Nach Bedarf und in dem Abstand, der für Sie passt. Es gibt keine Mindestanzahl.
konditionen:
  titel: Konditionen
  liste:
  - titel: Tarif
    text: 'Der Tarif richtet sich nach dem Einkommen. Der Tarif richtet sich nach dem Einkommen und beträgt zwischen 110 und 210 CHF pro 60 Minuten. Sie ordnen sich selbst ein; ein Nachweis ist nicht nötig. Das Erstgespräch wird zum gleichen Tarif verrechnet.'
  - titel: Absage
    text: Termine können bis 24 Stunden vorher kostenlos verschoben oder abgesagt werden.
  - titel: Schweigepflicht
    text: Alles, was Sie besprechen, bleibt vertraulich.
  - titel: Abgrenzung
    text: Die Praxis bietet keinen Notfalldienst. In akuten Krisen wenden Sie sich bitte an die unten genannten Stellen.
ueber:
  titel: Über mich
  text: '[Drei bis fünf Sätze in der Ich-Form: beruflicher Hintergrund, warum die Arbeit mit Eltern, was Ihnen in der Beratung wichtig ist.]'
  bild: ''
  bild_alt: ''
  punkte:
  - '[Jahr] · [Abschluss, Hochschule]'
  - '[Jahr] · [Weiterbildung]'
  - '[Jahre] · [Berufliche Station]'
  - '[Mitgliedschaft Berufsverband]'
termin:
  titel: Termin buchen
  text: Wählen Sie eine freie Zeit für das Erstgespräch. Die Bestätigung mit dem Videolink erhalten Sie per E-Mail.
  hinweis: Ihre Angaben werden auf Servern in der Schweiz gespeichert und nicht weitergegeben.
  knopf: Freie Termine ansehen
fragen:
  titel: Häufige Fragen
  liste:
  - frage: Was ist der Unterschied zwischen Elternberatung und Psychotherapie?
    antwort: Elternberatung befasst sich mit konkreten Fragen rund um Erziehung und Familienalltag und ist meist kurz. Psychotherapie behandelt psychische Erkrankungen und setzt eine Abklärung voraus. [Ergänzen, wie Sie vorgehen, wenn sich im Gespräch ein Therapiebedarf zeigt.]
  - frage: Müssen beide Elternteile teilnehmen?
    antwort: Nein. Sie können allein kommen oder gemeinsam. [Ihre Empfehlung ergänzen.]
  - frage: Nimmt mein Kind an den Gesprächen teil?
    antwort: '[Antwort: in der Regel nur die Eltern / ab welchem Alter und wann das Kind einbezogen wird.]'
  - frage: Wie viele Gespräche braucht es?
    antwort: Das hängt vom Anliegen ab. [Ihre Erfahrung ergänzen, z. B. typische Anzahl.]
  - frage: Wie funktioniert ein Gespräch per Video?
    antwort: Sie erhalten mit der Bestätigung einen Link und brauchen nur ein Gerät mit Kamera und Mikrofon sowie einen ungestörten Ort. [Verwendetes Videotool nennen.]
  - frage: Übernimmt die Krankenkasse die Kosten?
    antwort: 'Nein.'
fusszeile:
